# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# Keep these URLs relative (starting with "/"). An absolute URL such as
# "https://messinavincenzo.github.io/teaching/" always points at the published
# site, so the link would jump away from a local preview and would break if the
# domain ever changed.

main:
  - title: "News"
    url: /year-archive/

  - title: "Projects"
    url: /portfolio/

  - title: "Teaching"
    url: /teaching/

  - title: "Publications"
    url: /publications/

  - title: "CV"
    url: /cv/

  - title: "Photos"
    url: /photos/
